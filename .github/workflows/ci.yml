name: CI
on: [push, pull_request]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --target wasm32v1-none --release --locked

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        crate: [eco-token, task-registry, reward-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.83
      - name: Run unit tests
        run: cargo nextest run -p ${{ matrix.crate }} --junit-xml target/nextest/${{ matrix.crate }}.xml
      - name: Publish Test Report
        uses: test-summary/action@v2
        with:
          paths: target/nextest/${{ matrix.crate }}.xml
        if: always()

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.83
      - name: Run integration tests
        run: cargo nextest run --test reward_integration_test --test-threads 1 --junit-xml target/nextest/integration.xml
      - name: Publish Test Report
        uses: test-summary/action@v2
        with:
          paths: target/nextest/integration.xml
        if: always()
